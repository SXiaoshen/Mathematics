<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>玩转数学 · 等边三角形点的轨迹</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17233b;font-family:Inter,"Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 22px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:20px;font-weight:800;color:#4058d6}.tag{background:#e9edff;color:#4058d6;padding:7px 12px;border-radius:99px;font-size:13px}.hero{margin-bottom:20px}.hero h1{font-size:28px;margin:0 0 7px}.hero p{margin:0;color:#65728a}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:18px}.card{background:white;border:1px solid #e6eaf1;border-radius:18px;box-shadow:0 8px 24px #2538580a;padding:18px}.canvasbox{position:relative}canvas{width:100%;height:auto;display:block;border-radius:12px;background:#fbfcff;touch-action:none}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 2px 0;color:#5f6c82;font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.controls h2,.card h2{font-size:17px;margin:0 0 14px}.control{margin:18px 0}.control label{display:flex;justify-content:space-between;font-size:14px;font-weight:650;margin-bottom:9px}.control output{color:#4058d6;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#5268e8}.buttons{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:#edf0ff;color:#4058d6}.button.primary{background:#5268e8;color:white}.button.active{background:#e8dafa;color:#713cb0}.formula{margin-top:20px;padding:14px;border-radius:12px;background:#f7f8fc;color:#526078;font-size:13px;line-height:1.7}.formula strong{color:#24324b}.question{margin-top:18px;line-height:1.75;color:#4c5970;font-size:14px}.question b{color:#25334b}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f5;font-size:14px}.stat:last-child{border:0}.hint{font-size:12px;color:#8792a5;margin-top:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero h1{font-size:23px}.wrap{padding:18px 14px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">◈ 玩转数学</div><div class="tag">几何 · 动点与轨迹</div></div><header class="hero"><h1>等边三角形：点 P 的轨迹区域</h1><p>拖动 A、B，观察以 AB 为边构造等边三角形时，顶点 P 能到达哪里。</p></header><section class="layout"><div class="card canvasbox"><canvas id="plane" width="760" height="590" aria-label="平面直角坐标系和点的轨迹区域"></canvas><div class="legend"><span><i class="dot" style="background:#8fa0ff"></i>P 的全部可能位置</span><span><i class="dot" style="background:#4058d6"></i>当前等边三角形</span><span><i class="dot" style="background:#f08b55"></i>A、B 动点</span></div><div class="hint">提示：可以直接在图上拖动 A 或 B；虚线区域由两种等边三角形方向共同形成。</div></div><aside><div class="card controls"><h2>动点控制</h2><div class="control"><label for="av">A 的纵坐标 <output id="ao">2.0</output></label><input id="av" type="range" min="0" max="4" step="0.1" value="2"></div><div class="control"><label for="bv">B 的横坐标 <output id="bo">2.0</output></label><input id="bv" type="range" min="0" max="4" step="0.1" value="2"></div><div class="buttons"><button class="button primary" id="play">▶ 自动演示</button><button class="button" id="reset">重置</button><button class="button" id="other">显示另一区域</button></div><div class="formula"><strong>坐标关系</strong><br>A=(0,a)，B=(b,0)，其中 0≤a,b≤4。<br>将向量 AB 旋转 ±60°，从 AB 的中点得到 P。</div></div><div class="card question"><h2>想一想</h2><div class="stat"><span>构造方式</span><b>AB 的两侧各一个 P</b></div><div class="stat"><span>运动参数</span><b>0 ≤ a,b ≤ 4</b></div><p><b>探索问题：</b>当 A、B 都可以连续移动时，P 的所有可能位置组成什么区域？拖动滑块，比较两个方向的轨迹。</p></div></aside></section></main>
<script>
const c=document.querySelector('#plane'),ctx=c.getContext('2d'),av=document.querySelector('#av'),bv=document.querySelector('#bv'),ao=document.querySelector('#ao'),bo=document.querySelector('#bo');let a=2,b=2,drag=null,timer=null,showOther=false;
const O={x:380,y:330},s=58;function xy(x,y){return{x:O.x+x*s,y:O.y-y*s}}function P(sign,a0=a,b0=b){return{ x:(b0+sign*Math.sqrt(3)*a0)/2, y:(a0+sign*Math.sqrt(3)*b0)/2}}
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fbfcff';ctx.fillRect(0,0,c.width,c.height);
// attainable set: dense sampled image of the parameter square for both orientations
for(let sign of (showOther?[-1,1]:[1])){let col=sign===1?'rgba(91,112,239,.16)':'rgba(154,99,211,.16)';ctx.fillStyle=col;for(let i=0;i<=80;i++)for(let j=0;j<=80;j++){let p=P(sign,i/20,j/20),q=xy(p.x,p.y);ctx.fillRect(q.x-1.7,q.y-1.7,3.4,3.4)}let corners=[[0,0],[4,0],[4,4],[0,4],[0,0]].map(v=>xy(P(sign,v[0],v[1]).x,P(sign,v[0],v[1]).y));ctx.strokeStyle=sign===1?'#5268e8':'#9a63d3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(corners[0].x,corners[0].y);for(const q of corners.slice(1))ctx.lineTo(q.x,q.y);ctx.stroke()}
ctx.strokeStyle='#dfe5ef';ctx.lineWidth=1;for(let i=-6;i<=6;i++){let q=xy(i,0);ctx.beginPath();ctx.moveTo(q.x,xy(i,-6).y);ctx.lineTo(q.x,xy(i,6).y);ctx.stroke();q=xy(0,i);ctx.beginPath();ctx.moveTo(xy(-6,i).x,q.y);ctx.lineTo(xy(6,i).x,q.y);ctx.stroke()}
ctx.strokeStyle='#35435c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xy(-6,0).x,O.y);ctx.lineTo(xy(6,0).x,O.y);ctx.moveTo(O.x,xy(0,-4.5).y);ctx.lineTo(O.x,xy(0,6).y);ctx.stroke();ctx.fillStyle='#35435c';ctx.font='13px sans-serif';ctx.fillText('x',xy(5.8,0).x,O.y+18);ctx.fillText('y',O.x+8,xy(0,5.8).y);for(let i=-5;i<=5;i++){if(!i)continue;let q=xy(i,0);ctx.fillText(i,q.x-5,O.y+16);q=xy(0,i);ctx.fillText(i,O.x-17,q.y+4)}
let A=xy(0,a),B=xy(b,0);ctx.setLineDash([5,5]);ctx.strokeStyle='#a3adbf';ctx.beginPath();ctx.moveTo(O.x,A.y);ctx.lineTo(A.x,A.y);ctx.moveTo(B.x,B.y);ctx.lineTo(B.x,O.y);ctx.stroke();ctx.setLineDash([]);
for(let sign of (showOther?[-1,1]:[1])){let p=P(sign),Q=xy(p.x,p.y);ctx.strokeStyle=sign===1?'#4058d6':'#9a63d3';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.lineTo(Q.x,Q.y);ctx.closePath();ctx.stroke();ctx.fillStyle=sign===1?'#4058d6':'#9a63d3';ctx.beginPath();ctx.arc(Q.x,Q.y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#25334b';ctx.font='bold 16px sans-serif';ctx.fillText(sign===1?'P₁':'P₂',Q.x+10,Q.y-9)}
for(let [pt,col,label] of [[A,'#f08b55','A'],[B,'#f08b55','B']]){ctx.fillStyle=col;ctx.beginPath();ctx.arc(pt.x,pt.y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#25334b';ctx.font='bold 16px sans-serif';ctx.fillText(label,pt.x+10,pt.y-10)}let z=xy(0,0);ctx.fillStyle='#25334b';ctx.beginPath();ctx.arc(z.x,z.y,3,0,7);ctx.fill()}
function sync(){a=+av.value;b=+bv.value;ao.value=a.toFixed(1);bo.value=b.toFixed(1);draw()}av.oninput=bv.oninput=sync;document.querySelector('#other').onclick=e=>{showOther=!showOther;e.target.textContent=showOther?'隐藏另一区域':'显示另一区域';e.target.classList.toggle('active',showOther);draw()};document.querySelector('#reset').onclick=()=>{av.value=bv.value=2;sync()};document.querySelector('#play').onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='▶ 自动演示';return}e.target.textContent='❚❚ 暂停';let k=0;timer=setInterval(()=>{k+=.035;av.value=(2+2*Math.sin(k)).toFixed(1);bv.value=(2+2*Math.sin(k+1.4)).toFixed(1);sync()},45)};
function point(ev){let r=c.getBoundingClientRect();return{x:(ev.clientX-r.left)*c.width/r.width,y:(ev.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{let p=point(e),A=xy(0,a),B=xy(b,0);if(Math.hypot(p.x-A.x,p.y-A.y)<25)drag='a';else if(Math.hypot(p.x-B.x,p.y-B.y)<25)drag='b';if(drag)c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;let p=point(e);if(drag==='a')av.value=Math.max(0,Math.min(4,(O.y-p.y)/s)).toFixed(1);else bv.value=Math.max(0,Math.min(4,(p.x-O.x)/s)).toFixed(1);sync()};c.onpointerup=()=>drag=null;sync();
</script></body></html>
